
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Auto Scan - Camera Live</title>

    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>

    <main class="app-container">

        <header class="app-header">
            <h1>Auto Scan</h1>
            <p>Reconnaissance automatique des plaques</p>
        </header>

        <section class="camera-section">

            <div class="camera-container">

                <video
                    id="camera"
                    autoplay
                    muted
                    playsinline>
                </video>

                <div class="scan-frame"></div>

            </div>

            <div class="camera-status">
                <span id="status">Caméra arrêtée</span>
            </div>

        </section>

        <section class="controls">

            <button id="startCamera" type="button">
                Start Camera
            </button>

            <button id="stopCamera" type="button" disabled>
                Stop Camera
            </button>

        </section>

        <section class="results">

            <h2>Matricules détectées</h2>

            <div id="plateList">
                <p>Aucune matricule détectée</p>
            </div>

        </section>

    </main>

</body>
</html>
